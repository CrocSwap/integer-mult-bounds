name: Verify full-center composition research

on:
  pull_request:
    paths:
      - 'research/roadmap48/**'
      - 'tests/test_roadmap48.py'
      - '.github/workflows/roadmap48.yml'
  push:
    paths:
      - 'research/roadmap48/**'
      - 'tests/test_roadmap48.py'
      - '.github/workflows/roadmap48.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Independently rebuild words, recount cost, scan retiming, and check all public receipts
        run: python -B research/roadmap48/verify.py --check-committed
      - name: Check the selected construction's source bindings
        run: |
          python -B scripts/verify_selected_result.py
          python -B -m unittest discover -s tests -p test_selected_result.py -v
          python -B -m unittest discover -s tests -p test_frontier799_bindings.py -v
      - name: Require unchanged tracked files
        run: git diff --exit-code
