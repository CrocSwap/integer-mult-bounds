name: Formal mixed GL3 bit targets
on:
  pull_request:
    paths:
      - 'research/bit-gl3-mixed-targets-seed18/**'
      - '.github/workflows/bit-gl3-mixed-targets.yml'
  push:
    branches: [main]
    paths:
      - 'research/bit-gl3-mixed-targets-seed18/**'
      - '.github/workflows/bit-gl3-mixed-targets.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bit-gl3-mixed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  full-formal-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compiler and metadata
        run: |
          c++ --version
          python3 -B scripts/research_package.py --package research/bit-gl3-mixed-targets-seed18 --check-only
      - name: Full formal census, independent native census and boundary controls
        run: python3 -I -B research/bit-gl3-mixed-targets-seed18/verify.py
      - name: Committed inputs remain unchanged
        run: git diff --exit-code
