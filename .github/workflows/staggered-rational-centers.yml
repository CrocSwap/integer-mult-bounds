name: Verify staggered rational centers
on: [push, pull_request]
jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python research/staggered-rational-centers/verify.py
      - run: python research/staggered-rational-centers/test_controls.py
      - run: python research/reversed-rational-centers/verify.py
      - run: python research/reversed-rational-centers/test_controls.py
