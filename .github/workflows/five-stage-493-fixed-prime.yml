name: Fixed prime, seven levels and eta 1e-24 on the 493-source five-stage banks
on:
  pull_request:
    paths:
      - 'research/five-stage-493-fixed-prime/**'
      - 'research/five-stage-banks-493/**'
      - '.github/workflows/five-stage-493-fixed-prime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: CrocSwap/integer-mult-bounds
          ref: af3fe331ca60c936229e060681ffccbc1c208678
          path: .dependencies/pr234
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: eumemic/integer-mult-bounds
          ref: 13311491eb74a3a9a443ba4e318c68c263f064f0
          path: .dependencies/pr210
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install sympy==1.14.0
      - run: python -B research/five-stage-493-fixed-prime/verify.py --pr210-root .dependencies/pr210 --pr234-root .dependencies/pr234 --full
      - run: git diff --exit-code
  prime-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the fixed Lean release in runner temporary storage
        run: |
          python -m pip install zstandard==0.25.0
          curl -fsSL https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          python - <<'PY'
          import hashlib,os,tarfile,zstandard
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          expected='b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec'
          assert hashlib.sha256((root/'lean.tar.zst').read_bytes()).hexdigest()==expected
          with (root/'lean.tar.zst').open('rb') as f:
              with zstandard.ZstdDecompressor().stream_reader(f) as reader:
                  with tarfile.open(fileobj=reader,mode='r|') as archive:
                      archive.extractall(root,filter='data')
          PY
          echo "$RUNNER_TEMP/lean-4.24.0-linux/bin" >> "$GITHUB_PATH"
      - name: Kernel-check the prime in a separate project copy
        env:
          MATHLIB_CACHE_DIR: ${{ runner.temp }}/mathlib-cache
        run: |
          cp -R research/five-stage-493-fixed-prime "$RUNNER_TEMP/prime-proof"
          cd "$RUNNER_TEMP/prime-proof"
          lake update
          lake exe cache get Mathlib.NumberTheory.LucasLehmer
          lake env lean Prime.lean
