name: Verify source-assisted bit word
on:
  push:
    paths:
      - 'research/source-assisted-bit-bootstrap/**'
      - '.github/workflows/source-assisted-bit-bootstrap.yml'
  pull_request:
    paths:
      - 'research/source-assisted-bit-bootstrap/**'
      - '.github/workflows/source-assisted-bit-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Full emitted word, independent audit and exact assembly
        run: python3 -B research/source-assisted-bit-bootstrap/verify.py --full
      - name: Reproduction leaves research sources unchanged
        run: git diff --exit-code
