# Manual research replay; archival intake is not scientific validation.
# See docs/research/research-archive-intake.md before dispatching.
name: Coupled partial read-exchange checks
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: research-archive-replay
  cancel-in-progress: false

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '${{ matrix.python }}'
      - name: Re-enumerate both domains and independently check every refusal
        run: python -B -I -O research/complex-read-exchange/verify.py
      - name: Confirm verification leaves tracked files unchanged
        run: git diff --exit-code
