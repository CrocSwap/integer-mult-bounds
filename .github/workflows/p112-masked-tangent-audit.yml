name: P112 masked decoder component

on:
  pull_request:
    paths:
      - 'research/p112-masked-tangent-audit/**'
      - 'research/complex-frame-pair-decoders/**'
      - 'research/complex-decoder-field-extension-seed44/**'
      - 'certificates/selected-result.json'
      - 'scripts/verify_selected_result.py'
      - 'tests/test_selected_result.py'
      - '.github/workflows/p112-masked-tangent-audit.yml'
  push:
    paths:
      - 'research/p112-masked-tangent-audit/**'
      - 'research/complex-frame-pair-decoders/**'
      - 'research/complex-decoder-field-extension-seed44/**'
      - 'certificates/selected-result.json'
      - 'scripts/verify_selected_result.py'
      - 'tests/test_selected_result.py'
      - '.github/workflows/p112-masked-tangent-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p112-masked-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Exact checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Primary exact Jacobian certificate
        run: python -I -B research/p112-masked-tangent-audit/verify.py
      - name: Independent split-system certificate
        run: python -I -B research/p112-masked-tangent-audit/independent.py
      - name: Optimized relocation and rejection controls
        run: python -I -B research/p112-masked-tangent-audit/test_package.py
      - name: Inherited complex decoder floor
        run: python -I -B research/complex-decoder-field-extension-seed44/verify.py
      - name: Selected-record integrity and regressions
        run: |
          python -I -B scripts/verify_selected_result.py
          python -B -m unittest discover -s tests -p 'test_selected_result.py'
      - name: Require unchanged tracked sources and certificates
        run: git diff --exit-code
