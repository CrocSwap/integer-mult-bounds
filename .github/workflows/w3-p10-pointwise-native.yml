name: Complete pointwise w3 p10 admission
on:
  pull_request:
    paths:
      - 'research/w3-p10-pointwise-native/**'
      - '.github/workflows/w3-p10-pointwise-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/w3-p10-pointwise-native/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Replay every immutable stage
        run: python -B research/w3-p10-pointwise-native/verify.py --output "$RUNNER_TEMP/w3-p10-pointwise-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-p10-pointwise-native-proof
          path: ${{ runner.temp }}/w3-p10-pointwise-proof
