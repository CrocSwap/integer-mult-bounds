name: Verify source-bound five-stage V8

on:
  push:
    paths:
      - 'research/five-stage-source-bound-v8/**'
      - '.github/workflows/five-stage-source-bound-v8.yml'
  pull_request:
    paths:
      - 'research/five-stage-source-bound-v8/**'
      - '.github/workflows/five-stage-source-bound-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install pinned verification dependency
        run: python3 -m pip install --disable-pip-version-check -r research/five-stage-source-bound-v8/requirements.txt
      - name: Reproduce all mandatory finite verification stages
        run: |
          python3 -B research/five-stage-source-bound-v8/verify.py \
            --output "$RUNNER_TEMP/five-stage-v8-${{ github.run_id }}-${{ github.run_attempt }}"
          git diff --exit-code
