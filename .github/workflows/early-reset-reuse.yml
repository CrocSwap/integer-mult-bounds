name: Verify early reset and kernel composition
on:
  workflow_dispatch:
# Historical sweeps are opt-in; dispatch one at a time.
concurrency:
  group: research-archive-replay
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B research/e8-early-reset-kernel/verify.py "$RUNNER_TEMP/early-reset-reuse"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: early-reset-reuse-${{ matrix.python }}
          path: ${{ runner.temp }}/early-reset-reuse
