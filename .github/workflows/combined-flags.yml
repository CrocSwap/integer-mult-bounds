name: Verify combined coordinate flags
on: [push, pull_request]
jobs:
  combined:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 research/combined-flags/verify.py
      - run: cd research/combined-flags && python3 -m unittest test_controls -v
