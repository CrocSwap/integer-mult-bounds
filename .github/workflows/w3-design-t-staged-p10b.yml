name: w3-design-t-staged-p10b

on:
  pull_request:
    paths:
      - 'research/w3-design-t-staged-p10b/**'
      - '.github/workflows/w3-design-t-staged-p10b.yml'
  push:
    paths:
      - 'research/w3-design-t-staged-p10b/**'
      - '.github/workflows/w3-design-t-staged-p10b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (numpy, mpmath, C++17 compiler, Boost headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libboost-dev
          python -m pip install numpy==2.3.5 mpmath==1.3.0
      - name: Quick verification (manifest, staged word, Design T + twin rebuild, legality, columns, E8 supplier, kappa)
        run: bash research/w3-design-t-staged-p10b/verify.sh --quick "$RUNNER_TEMP/dtst-quick"
      - name: Full verification (adds the PR346 rebuild control)
        run: bash research/w3-design-t-staged-p10b/verify.sh "$RUNNER_TEMP/dtst-full"
      - name: Require an unchanged tree
        run: git diff --exit-code
