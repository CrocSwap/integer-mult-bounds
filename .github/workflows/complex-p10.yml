name: complex-p10

on:
  pull_request:
    paths:
      - 'research/complex-p10/**'
      - '.github/workflows/complex-p10.yml'
  push:
    paths:
      - 'research/complex-p10/**'
      - '.github/workflows/complex-p10.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the regeneration dependencies of the pinned pipeline
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Regenerate the p = 10 words, check the frozen layers and pairs, run flow, lift and contract, emit the gcert/1 programs, run gx.check1 and gxcore, price the five-stage words at h = 20, compare with the committed certificates
        run: python3 -B research/complex-p10/verify.py
      - name: Require an unchanged tree
        run: git diff --exit-code
