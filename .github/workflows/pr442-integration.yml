name: PR442 inherited invocation integration

on:
  push:
    branches: [lean/pr442-level-model]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr442-inherited-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install the pinned Lean toolchain manager
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned extraction dependencies
        run: python3 -m pip install -r research/lean-external-review/requirements.txt
      - name: Fetch the pinned Mathlib cache
        working-directory: research/lean-multi-host-source
        run: >-
          lake exe cache get Mathlib.Data.Matrix.Mul
          Mathlib.Algebra.BigOperators.Fin Mathlib.Tactic.FieldSimp
          Mathlib.Tactic.Ring Mathlib.Tactic.NormNum
      - name: Reconstruct inputs, build modules and audit axioms
        run: make formal-pr442-verify
      - name: Preserve the exact-commit invocation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr442-inherited-invocation
          path: /tmp/pr442-lean421-fresh.json
          if-no-files-found: warn
