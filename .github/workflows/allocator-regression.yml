name: Allocator failure and conservation regressions
on:
  push:
    paths:
      - 'research/complex-delivery-map-open-allocator/**'
      - '.github/workflows/allocator-regression.yml'
  pull_request:
    paths:
      - 'research/complex-delivery-map-open-allocator/**'
      - '.github/workflows/allocator-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m pip install ortools==9.15.6755
      - run: python3 -B research/complex-delivery-map-open-allocator/tools/test_allocator.py
      - run: git diff --exit-code
