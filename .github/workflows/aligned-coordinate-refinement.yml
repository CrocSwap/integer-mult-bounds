name: Verify aligned coordinate refinement
on: [push, pull_request]
jobs:
  coordinates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python research/aligned-coordinate-refinement/verify.py --regenerate
      - run: python research/aligned-coordinate-refinement/test_controls.py
