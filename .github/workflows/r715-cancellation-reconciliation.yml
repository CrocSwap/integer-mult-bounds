name: R715 cancellation evidence reconciliation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/r715-cancellation-reconciliation/**'
      - 'research/experiment-log/negative-searches/commuting-cancellations/**'
      - 'research/experiment-log/negative-searches/nested-donors/trial-1[6-9]/**'
      - 'research/experiment-log/MANIFEST.json'
      - 'research/e8-r480-nine-stage/vendor/e8-r740-replica32/code/e8core.py'
      - '.github/workflows/r715-cancellation-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'research/r715-cancellation-reconciliation/**'
      - 'research/experiment-log/negative-searches/commuting-cancellations/**'
      - 'research/experiment-log/negative-searches/nested-donors/trial-1[6-9]/**'
      - 'research/experiment-log/MANIFEST.json'
      - 'research/e8-r480-nine-stage/vendor/e8-r740-replica32/code/e8core.py'
      - '.github/workflows/r715-cancellation-reconciliation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Repository baseline pin.
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # Repository baseline pin.
        with:
          python-version: ${{ matrix.python }}
      - name: Replay the full exact receipt
        run: python -I -O -B research/r715-cancellation-reconciliation/verify.py
      - name: Independent frame oracle and corruption controls
        run: python -I -O -B research/r715-cancellation-reconciliation/test_package.py
      - name: Require unchanged tracked files
        if: always()
        run: git diff --exit-code
