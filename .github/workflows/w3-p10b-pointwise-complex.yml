name: w3-p10b-pointwise-complex

on:
  pull_request:
    paths:
      - 'research/w3-p10b-pointwise-complex/**'
      - '.github/workflows/w3-p10b-pointwise-complex.yml'
  push:
    paths:
      - 'research/w3-p10b-pointwise-complex/**'
      - '.github/workflows/w3-p10b-pointwise-complex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the regeneration dependencies of the pinned pipeline
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Pins, bit side, the committed complex program (gx.check1, gxcore, exact price) and kappa
        run: python3 -B research/w3-p10b-pointwise-complex/verify.py --quick
      - name: Regenerate the per-point complex program with PR327's chain and compare byte for byte
        run: python3 -B research/w3-p10b-pointwise-complex/verify.py
      - name: Require an unchanged tree
        run: git diff --exit-code
