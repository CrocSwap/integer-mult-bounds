name: P112 root-star integer cover
on:
  pull_request:
    paths:
      - 'research/root-star-integer-cover-seed46/**'
      - '.github/workflows/root-star-integer-cover.yml'
  push:
    branches: [main]
    paths:
      - 'research/root-star-integer-cover-seed46/**'
      - '.github/workflows/root-star-integer-cover.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Both exact implementations and failure controls
        run: python -I -O -B research/root-star-integer-cover-seed46/test_package.py
      - name: Committed artifacts remain unchanged
        run: git diff --exit-code
