name: Native Windows replay lifetime review
on:
  push:
    branches: [review/windows-replay-20261016]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-replay-review
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Native current and historical lifetime controls
        shell: pwsh
        run: |
          python -B tests/test_research_windows_job.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O -B tests/test_research_windows_job.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/test_research_windows_process_tree.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O -B tests/test_research_windows_process_tree.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve tracked inputs
        shell: pwsh
        run: git diff --exit-code
