name: T148 carrier complete verification
# Source archive only: this expensive replay requires an explicit manual dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-archive-replay
  cancel-in-progress: false
jobs:
  complete-release:
    if: github.repository == 'CrocSwap/integer-mult-bounds'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONINTMAXSTRDIGITS: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts
            docs
            certificates
            research/rank7-joint-endframes
            research/rank7-t740-release
            research/rank7-t148-restore-release
            research/two-sided-helper-extraction
            research/t148-carrier-skips
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact scientific dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.15.3 sympy==1.14.0 mpmath==1.3.0 gmpy2==2.3.2
      - name: Fetch exact public source commits
        run: |
          python - <<'PY'
          import json, re, subprocess
          rows = json.load(open('research/t148-carrier-skips/GIT-SOURCES.json'))
          heads = sorted({r['head'] for r in rows})
          assert all(re.fullmatch('[0-9a-f]{40}', h) for h in heads)
          subprocess.run(['git','fetch','--no-tags','https://github.com/CrocSwap/integer-mult-bounds.git',*heads],check=True)
          PY
      - name: Run both complete releases without weakening any scientific check
        run: python -B research/t148-carrier-skips/ci_full.py --work "$RUNNER_TEMP/t148-complete-verification"
      - name: Registered finite replay after both completed releases
        run: python -B scripts/research_package.py --package research/t148-carrier-skips
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-t148-carrier-package
          path: research/t148-carrier-skips/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
