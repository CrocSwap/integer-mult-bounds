name: Reproduce paired-cube open search

on:
  push:
    paths:
      - 'research/paired-cube-open-search/**'
      - '.github/workflows/paired-cube-open-search.yml'
  pull_request:
    paths:
      - 'research/paired-cube-open-search/**'
      - '.github/workflows/paired-cube-open-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install pinned numpy and scipy
        run: python3 -m pip install -r research/paired-cube-open-search/requirements.txt
      - name: Generator output through PR161's unchanged checker, with exact replay
        run: python3 -B research/paired-cube-open-search/reproduce.py
      - name: One-configuration search smoke test
        run: python3 -B research/paired-cube-open-search/search.py --evaluate '{"abo": "cyclic"}'
