name: Balanced split finite witness

on:
  pull_request:
    paths:
      - 'research/balanced-split-reclamation/**'
      - 'research/pair-assembly/**'
      - 'scripts/experiments/binary_frame*'
      - 'references/frame-compiler/pr48/**'
      - '.github/workflows/balanced-split.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make -C research/balanced-split-reclamation verify
