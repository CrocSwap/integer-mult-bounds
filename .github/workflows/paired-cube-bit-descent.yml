name: paired-cube-bit-descent
on:
  pull_request:
    paths:
      - 'research/paired-cube-bit-descent/**'
      - 'research/paired-cube-balanced-161/**'
      - 'research/paired-cube-bit/**'
      - '.github/workflows/paired-cube-bit-descent.yml'
  push:
    paths:
      - 'research/paired-cube-bit-descent/**'
      - '.github/workflows/paired-cube-bit-descent.yml'
jobs:
  finite-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B research/paired-cube-bit-descent/verify.py
      - run: git diff --exit-code
