name: Verify kernel132 and target217 composition
on:
  pull_request:
    paths:
      - 'research/kernel132-target217/**'
      - '.github/workflows/kernel132-target217.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-offline:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install -r research/kernel132-target217/requirements.txt
      - run: python3 -B research/kernel132-target217/verify.py --output "$RUNNER_TEMP/kernel132-target217-verification"
      - run: git diff --exit-code
