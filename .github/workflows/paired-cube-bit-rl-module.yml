name: Verify mixed-gap bit module on PR168

on:
  push:
    paths:
      - 'research/paired-cube-bit-rl-module/**'
      - 'research/paired-cube-bit/**'
      - 'scripts/paired_cube*.py'
      - '.github/workflows/paired-cube-bit-rl-module.yml'
  pull_request:
    paths:
      - 'research/paired-cube-bit-rl-module/**'
      - 'research/paired-cube-bit/**'
      - 'scripts/paired_cube*.py'
      - '.github/workflows/paired-cube-bit-rl-module.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Rebuild, bit checker, bit word, prime witnesses and exact assembly
        run: python3 -B research/paired-cube-bit-rl-module/prove.py
