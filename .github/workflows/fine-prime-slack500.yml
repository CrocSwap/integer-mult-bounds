name: Fine-prime slack500 complete replay
on:
  push:
    paths:
      - 'research/fine-prime-slack500/**'
      - '.github/workflows/fine-prime-slack500.yml'
  pull_request:
    paths:
      - 'research/fine-prime-slack500/**'
      - '.github/workflows/fine-prime-slack500.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONINTMAXSTRDIGITS: '0'
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.3.5 sympy==1.14.0 mpmath==1.3.0
      - name: Require newline-only equivalence and rejecting controls
        run: |
          python -B research/fine-prime-slack500/test_portable_parent.py --work "$RUNNER_TEMP/slack500-portable-controls"
          python -O -B research/fine-prime-slack500/test_portable_parent.py --work "$RUNNER_TEMP/slack500-portable-controls-optimized"
      - name: Fresh complete native replay and additive exact refinement
        run: |
          python -B research/fine-prime-slack500/verify_refinement.py --main "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/slack500" --jobs 2 --timeout-seconds 1800
          cat "$RUNNER_TEMP/slack500/RESULT.json"
      - name: Require committed sources unchanged
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Preserve source-bound replay receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fine-prime-slack500-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/slack500/RESULT.json
            ${{ runner.temp }}/slack500/PARENT-PORTABILITY*.json
            ${{ runner.temp }}/slack500/portable-parent/MANIFEST.json
            ${{ runner.temp }}/slack500/original/outer-tmp/outer/LEDGER.json
            ${{ runner.temp }}/slack500/original/outer-tmp/outer/INDEPENDENT.json
            ${{ runner.temp }}/slack500-portable-controls/RESULT.json
            ${{ runner.temp }}/slack500-portable-controls-optimized/RESULT.json
            ${{ runner.temp }}/slack500/INDEPENDENT-PROFILE.json
            ${{ runner.temp }}/slack500/STAGES.json
            ${{ runner.temp }}/slack500/*.log
            ${{ runner.temp }}/slack500/original/RELEASE-RECEIPT.json
            ${{ runner.temp }}/slack500/original/verify/STAGES.json
            ${{ runner.temp }}/slack500/original/verify/RESULT.json
            ${{ runner.temp }}/slack500/original/verify/strict/ASSEMBLY.json
            ${{ runner.temp }}/slack500/**/STAGES.json
            ${{ runner.temp }}/slack500/**/STEPS.json
            ${{ runner.temp }}/slack500/**/*.log
            ${{ runner.temp }}/slack500/**/ASSEMBLY.json
            ${{ runner.temp }}/slack500/**/OWNERS-AND-PROFILE.json
            ${{ runner.temp }}/slack500/**/PREFIX-AND-INVOICE.json
            ${{ runner.temp }}/slack500/refinement/outer/LEDGER.json
            ${{ runner.temp }}/slack500/refinement/outer/INDEPENDENT.json
          if-no-files-found: warn
