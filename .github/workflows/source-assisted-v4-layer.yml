name: source-assisted-v4-layer

on:
  pull_request:
    paths:
      - 'research/source-assisted-v4-layer/**'
      - '.github/workflows/source-assisted-v4-layer.yml'
  push:
    paths:
      - 'research/source-assisted-v4-layer/**'
      - '.github/workflows/source-assisted-v4-layer.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the regeneration dependencies of the pinned pipeline
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Regenerate the word, admit this package's physical layer, run flow, lift, contract and assembly, compare with certificate.json
        run: python3 -B research/source-assisted-v4-layer/verify.py
      - name: Require an unchanged tree
        run: git diff --exit-code
