name: Verify round8 reviewed finite candidate
on:
  push:
    paths:
      - 'research/coordinated-frames-and-entrance-banks/**'
      - 'research/community-round8-audit/**'
      - '.github/workflows/community-round8.yml'
  pull_request:
    paths:
      - 'research/coordinated-frames-and-entrance-banks/**'
      - 'research/community-round8-audit/**'
      - '.github/workflows/community-round8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '${{ matrix.python }}'
      - name: Complete frozen physical words and paid assembly
        run: python3 -B research/coordinated-frames-and-entrance-banks/verify.py
      - name: Independent low-residue schedule diagnostic
        run: python3 -B research/community-round8-audit/bank_schedule.py
      - name: Require unchanged tracked inputs
        run: git diff --exit-code
