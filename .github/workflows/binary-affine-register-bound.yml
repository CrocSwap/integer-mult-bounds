name: Verify binary affine register bound

on:
  pull_request:
    paths:
      - 'research/binary-affine-register-bound/**'
      - 'research/bit-three-register-lower-bound/README.md'
      - 'research/r439-bsection-stars-seed01/README.md'
      - '.github/workflows/binary-affine-register-bound.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-affine-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Full Cayley census and constructive comparison
        run: |
          python3 -I -B research/binary-affine-register-bound/verify.py --full --work "$RUNNER_TEMP/binary-affine-full"
          python3 -I -B research/binary-affine-register-bound/test_package.py
          git diff --exit-code
