name: Productive-helper conditional construction
# Historical checkpoint: available explicitly, not rerun for new selections.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontier4359-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/verify_frontier4359.py --work "$RUNNER_TEMP/frontier4359"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier4359-replay
          path: |
            ${{ runner.temp }}/frontier4359/VALIDATION.json
            ${{ runner.temp }}/frontier4359/logs
