name: Verify shared entrance gauge construction
on:
  pull_request:
    paths:
      - 'research/coordinated-crossover-pr200/**'
      - '.github/workflows/continued-kappa-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python3 -B research/coordinated-crossover-pr200/verify.py
      - run: git diff --exit-code
