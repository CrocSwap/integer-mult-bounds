name: W3 complete construction
on:
  push:
    branches: [codex/w3-target-prefix]
    paths: ['research/w3-target-prefix/**', '.github/workflows/w3-target-prefix.yml']
  pull_request:
    paths: ['research/w3-target-prefix/**', '.github/workflows/w3-target-prefix.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y g++ libboost-dev
      - run: python -m pip install -r research/w3-target-prefix/requirements.txt
      - run: python -B research/w3-target-prefix/verify.py --output "$RUNNER_TEMP/w3-replay" --cxx g++
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-proof-receipts
          path: |
            ${{ runner.temp }}/w3-replay/*.json
            ${{ runner.temp }}/w3-replay/logs
            ${{ runner.temp }}/w3-replay/baseline/verification.json
