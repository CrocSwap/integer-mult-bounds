name: Five-cube three-total boundary
on:
  pull_request:
    paths:
      - 'research/five-cube-three-totals/**'
      - '.github/workflows/five-cube-three-totals.yml'
  workflow_dispatch:
jobs:
  exact-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact replay, independent oracle and rejection controls
        run: python -I -O -B research/five-cube-three-totals/test_package.py
