name: Verify aligned coordinate edge
on: [push, pull_request]
jobs:
  aligned-coordinate-edge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 research/aligned-coordinate-edge/verify.py
      - run: cd research/aligned-coordinate-edge && python3 -m unittest test_controls -v
