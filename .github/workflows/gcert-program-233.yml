name: gcert-program-233

on:
  pull_request:
    paths:
      - 'research/gcert-program-233/**'
      - '.github/workflows/gcert-program-233.yml'
  push:
    paths:
      - 'research/gcert-program-233/**'
      - '.github/workflows/gcert-program-233.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the regeneration dependencies of the pinned pipeline
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Regenerate both words, run flow and lift, emit the gcert/1 programs, run gx.check1, compare with the committed certificates
        run: python3 -B research/gcert-program-233/verify.py
      - name: Require an unchanged tree
        run: git diff --exit-code
