name: P104 closed supplier replay

on:
  pull_request:
    paths:
      - research/p104-closed-supplier-relays/**
      - .github/workflows/p104-closed-supplier-relays.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    name: P104 / ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: [independent, application, charts-0, charts-1, charts-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: research/p104-closed-supplier-relays
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Acquire and hash the pinned public sources
        run: |
          python -I -B research/p104-closed-supplier-relays/prepare_sources.py "$RUNNER_TEMP/sources" --fetch
      - name: Rebuild both paths and verify the selected part
        env:
          REPLAY_PART: ${{ matrix.part }}
        run: |
          python -I -B research/p104-closed-supplier-relays/verify.py \
            --cache "$RUNNER_TEMP/sources" --output "$RUNNER_TEMP/result" --part "$REPLAY_PART"
