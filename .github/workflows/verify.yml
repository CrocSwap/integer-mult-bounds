name: Verify research artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

# Historical sweeps are opt-in; dispatch one at a time.
concurrency:
  group: research-archive-replay
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
        group: [community, producers, certificates, ternary, research, tests, strips, clones, positive, joint, pair, partial-gauge, three-stage-cover, paired-cube, recycled-bit, entrance-banks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch immutable baseline required by performance regression tests
        if: matrix.group == 'tests'
        run: git fetch --no-tags --depth=1 https://github.com/CrocSwap/integer-mult-bounds.git 0b1cccf86e2f5132ed286a26ef0a681a495740ea 0fdd7d82de03e43c9e5a1000dfbcd380d1b687d2 3b29a00f972bd15871baac0acf5ac204740a9863
      - name: Install headers for the exact enlarged-frame profiler
        if: matrix.group == 'positive'
        run: |
          if ! test -f /usr/include/boost/multiprecision/cpp_int.hpp; then
            sudo apt-get update
            sudo apt-get install -y libboost-dev
          fi
      - name: Check arithmetic, source hashes, finite identities, and patches
        run: |
          if [ "${{ matrix.group }}" = clones ]; then
            python -B scripts/replay_historical_check.py skip-clones
            python -B scripts/replay_historical_check.py split-skip
          elif [[ "${{ matrix.group }}" =~ ^(community|producers|strips|pair)$ ]]; then
            python -B scripts/replay_historical_check.py legacy-${{ matrix.group }}
          else
            make verify-${{ matrix.group }}
          fi
      - name: Require reproducible certificates and patches
        run: git diff --exit-code

  ranked-pair-finite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Fetch immutable PR62 construction sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: CrocSwap/integer-mult-bounds
          ref: ad0f25ff7b23cff7f08ad237c2254e6ecf74257e
          path: build/ranked-pair-upstream
          persist-credentials: false
      - name: Independently replay words and rebuild exact CRT profiles
        run: make ranked-pair-verify UPSTREAM=build/ranked-pair-upstream
      - name: Require unchanged tracked artifacts
        run: git diff --exit-code

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [historical, gaussian, matrix, pr442]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install elan; each project pins its Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib build cache
        if: matrix.package == 'historical'
        working-directory: formal/lean
        run: lake exe cache get
      - name: Install pinned PR442 extraction dependencies
        if: matrix.package == 'pr442'
        run: python3 -m pip install -r research/lean-external-review/requirements.txt
      - name: Fetch pinned PR442 Mathlib build cache
        if: matrix.package == 'pr442'
        working-directory: research/lean-multi-host-source
        run: >-
          lake exe cache get Mathlib.Data.Matrix.Mul
          Mathlib.Algebra.BigOperators.Fin Mathlib.Tactic.FieldSimp
          Mathlib.Tactic.Ring Mathlib.Tactic.NormNum
      - name: Check formal package and theorem axiom dependencies
        run: make formal-${{ matrix.package }}-verify
      - name: Preserve PR442 build receipt
        if: always() && matrix.package == 'pr442'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr442-lean421-receipt
          path: /tmp/pr442-lean421-fresh.json
          if-no-files-found: warn
