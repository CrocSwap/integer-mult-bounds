name: Selector batching exact check

on:
  pull_request:
    paths:
      - 'research/selector-batching/**'
      - '.github/workflows/selector-batching.yml'
  push:
    paths:
      - 'research/selector-batching/**'
      - '.github/workflows/selector-batching.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Replay all columns and negative controls, including under optimization
        run: |
          python3 -I -O -B research/selector-batching/verify.py
          git diff --exit-code
