name: Verify continued frame cuts on PR186
on:
  push:
    paths:
      - 'research/continued-frame-cuts-186/**'
      - 'research/coordinated-frames-and-entrance-banks/**'
      - '.github/workflows/continued-frame-cuts-186.yml'
  pull_request:
    paths:
      - 'research/continued-frame-cuts-186/**'
      - 'research/coordinated-frames-and-entrance-banks/**'
      - '.github/workflows/continued-frame-cuts-186.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python3 -B research/continued-frame-cuts-186/verify.py
