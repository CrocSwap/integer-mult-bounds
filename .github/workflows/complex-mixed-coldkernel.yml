name: Mixed cold-kernel provider
# Historical witness replay; selected-family automation is in frontier588.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B research/complex-mixed-coldkernel/verify.py --work /tmp/mixed-coldkernel-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-coldkernel-receipt-${{ matrix.python }}
          path: |
            /tmp/mixed-coldkernel-replay/RESULT.json
            /tmp/mixed-coldkernel-replay/RECEIPT.json
            /tmp/mixed-coldkernel-replay/STAGES.json
            /tmp/mixed-coldkernel-replay/ASSEMBLY.json
            /tmp/mixed-coldkernel-replay/ASSEMBLY-CONTROLS.json
