name: Verify signed prefix and padding fusion
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONINTMAXSTRDIGITS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: python -m pip install -r research/e8-prefix-restoration/requirements.txt
      - run: python -B research/e8-signed-padding/verify.py "$RUNNER_TEMP/signed-padding"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-padding-${{ matrix.python }}
          path: ${{ runner.temp }}/signed-padding
