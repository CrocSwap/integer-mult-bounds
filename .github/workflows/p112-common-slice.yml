name: P112 common-deletion slice

on:
  workflow_dispatch:

concurrency:
  group: research-archive-replay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  exact-slice:
    if: github.repository == 'CrocSwap/integer-mult-bounds'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Initialise P112 work directory
        run: echo "TMPDIR=$RUNNER_TEMP/p112-common-slice" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Configure runner temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/p112-common-slice"
          printf 'TMPDIR=%s/p112-common-slice\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install native checker dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libboost-dev
          g++ --version
          python --version
      - name: Replay the complete slice
        run: python -B research/p112-common-deletion-slice/verify.py
      - name: Run boundary and semantic controls
        run: python -O -B research/p112-common-deletion-slice/test_verify.py
