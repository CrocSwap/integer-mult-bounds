name: Replay P104 paid-slot and linked-cone certificates
on:
  pull_request:
    paths:
      - 'research/p104-paid88-stock-cones/**'
      - '.github/workflows/p104-paid88-stock-cones.yml'

permissions:
  contents: read

jobs:
  replay:
    name: P104 fixed-word certificates / ${{ matrix.scope }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: stock
            script: verify_stock.py
          - scope: cones
            script: cones/portable.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: research/p104-paid88-stock-cones
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Replay the pinned source and exact certificate
        env:
          REPLAY_SCRIPT: ${{ matrix.script }}
        working-directory: research/p104-paid88-stock-cones
        run: python -IB "$REPLAY_SCRIPT"
