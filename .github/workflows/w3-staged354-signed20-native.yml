name: Complete staged signed20 native admission
on:
  pull_request:
    paths:
      - 'research/w3-staged354-signed20-native/**'
      - 'research/w3-staged354-signed20-native-audit/**'
      - '.github/workflows/w3-staged354-signed20-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/w3-staged354-signed20-native/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Replay every immutable stage
        run: python -B research/w3-staged354-signed20-native/verify.py --output "$RUNNER_TEMP/w3-staged354-signed20-proof"
      - name: Independent word, bank, minor and assembly audit
        run: python -B research/w3-staged354-signed20-native-audit/verify.py --proof "$RUNNER_TEMP/w3-staged354-signed20-proof" --output "$RUNNER_TEMP/w3-staged354-signed20-audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-staged354-signed20-native-proof
          path: |
            ${{ runner.temp }}/w3-staged354-signed20-proof
            ${{ runner.temp }}/w3-staged354-signed20-audit
