name: Verify balanced deferred signed transfer
on: [push, pull_request]
jobs:
  balanced:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install sympy==1.14.0
      - run: python research/deferred-balanced/verify.py --replay-own
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python research/deferred-balanced/test_controls.py
