name: kappa-ceiling

on:
  pull_request:
    paths:
      - 'research/kappa-ceiling/**'
      - 'scripts/paired_cube/**'
      - 'scripts/paired_cube_*.py'
      - 'certificates/paired-cube-*.json'
      - '.github/workflows/kappa-ceiling.yml'
  push:
    paths:
      - 'research/kappa-ceiling/**'
      - '.github/workflows/kappa-ceiling.yml'

jobs:
  ceiling:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ceilings on this tree, compared with expected.json
        run: python3 research/kappa-ceiling/ceiling.py --check
