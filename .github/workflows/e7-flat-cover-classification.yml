name: Check the E7 flat-cover classification

on:
  push:
    paths:
      - 'research/e7-flat-cover-classification/**'
      - 'research/format-limits/scripts/d1_cover_numbers.py'
      - '.github/workflows/e7-flat-cover-classification.yml'
  pull_request:
    paths:
      - 'research/e7-flat-cover-classification/**'
      - 'research/format-limits/scripts/d1_cover_numbers.py'
      - '.github/workflows/e7-flat-cover-classification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Classify covers and near-covers of E7 by hyperplane flats
        run: python3 -B research/e7-flat-cover-classification/cover_check.py
      - name: Require committed files to remain unchanged
        run: git diff --exit-code
