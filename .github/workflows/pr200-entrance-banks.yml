name: Verify completed entrance banks on the PR200 bit word
on:
  push:
    paths:
      - 'research/pr200-entrance-banks/**'
      - 'research/paired-cube-diagonal-bit-168/**'
      - 'research/source-assisted-v4/certificate.json'
      - 'research/source-assisted/global/**'
      - 'scripts/paired_cube_assembly.py'
      - '.github/workflows/pr200-entrance-banks.yml'
  pull_request:
    paths:
      - 'research/pr200-entrance-banks/**'
      - 'research/paired-cube-diagonal-bit-168/**'
      - 'research/source-assisted-v4/certificate.json'
      - 'research/source-assisted/global/**'
      - 'scripts/paired_cube_assembly.py'
      - '.github/workflows/pr200-entrance-banks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rerun PR200, then rebuild the banks, charts, moments and assembly
        run: python -B research/pr200-entrance-banks/verify.py --full
      - name: Require an unchanged tree
        run: git diff --exit-code
