name: e8-bit-seven-stage

on:
  pull_request:
    paths:
      - 'research/e8-bit-seven-stage/**'
      - '.github/workflows/e8-bit-seven-stage.yml'
  push:
    paths:
      - 'research/e8-bit-seven-stage/**'
      - '.github/workflows/e8-bit-seven-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned dependencies and the Boost headers
        run: |
          python -m pip install --disable-pip-version-check -r research/e8-bit-seven-stage/requirements.txt
          sudo apt-get install -y --no-install-recommends libboost-dev
      - name: E8 bit word and E8 complex unit in the seven-stage bridged word (with the five-stage regressions)
        run: bash research/e8-bit-seven-stage/verify.sh "$RUNNER_TEMP/e8-bit-seven-stage-verify"
      - name: Require committed files to remain unchanged
        run: git diff --exit-code
