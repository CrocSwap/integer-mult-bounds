# Manual research replay; archival intake is not scientific validation.
# See docs/research/research-archive-intake.md before dispatching.
name: Cyclic inverse stride bridge
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-archive-replay
  cancel-in-progress: false

jobs:
  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -I -O research/cyclic-inverse-stride-bridge/verify.py --check
