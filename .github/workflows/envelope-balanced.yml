name: Verify envelope balanced flags
on: [push, pull_request]
jobs:
  envelope-balanced:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 research/envelope-balanced/verify.py --regenerate
      - run: cd research/envelope-balanced && python3 -m unittest test_controls -v
