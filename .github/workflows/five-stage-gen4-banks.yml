name: Verify gen4 bit word in the five-stage completed banks

on:
  push:
    paths:
      - 'research/five-stage-gen4-banks/**'
      - 'certificates/selected-result.json'
      - 'research/community-pr279-audit/certificate.json'
      - 'research/community-pr279-audit/verification.json'
      - 'scripts/verify_selected_result.py'
      - 'scripts/check_selected_replay.py'
      - 'tests/test_selected_result.py'
      - 'tests/test_selected_replay.py'
      - 'Makefile'
      - '.github/workflows/five-stage-gen4-banks.yml'
  pull_request:
    paths:
      - 'research/five-stage-gen4-banks/**'
      - 'certificates/selected-result.json'
      - 'research/community-pr279-audit/certificate.json'
      - 'research/community-pr279-audit/verification.json'
      - 'scripts/verify_selected_result.py'
      - 'scripts/check_selected_replay.py'
      - 'tests/test_selected_result.py'
      - 'tests/test_selected_replay.py'
      - 'Makefile'
      - '.github/workflows/five-stage-gen4-banks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned arithmetic dependency
        run: python -m pip install --disable-pip-version-check -r research/five-stage-gen4-banks/requirements.txt
      - name: Test the selected replay binding on literal data
        run: python -B -m unittest discover -s tests -p 'test_selected_replay.py' -v
      - name: Replay every mandatory stage and bind the selected finite certificate
        run: make gen4-bank-verify
      - name: Regenerate the pinned bit word from the generator and both physical-layer producers
        run: python -B research/five-stage-gen4-banks/gen4bit/producer/regenerate.py --work "$RUNNER_TEMP/gen4-regeneration"
      - name: Require committed files to remain unchanged
        run: git diff --exit-code
