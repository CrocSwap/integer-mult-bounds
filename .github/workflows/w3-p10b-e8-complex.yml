name: w3-p10b-e8-complex

on:
  pull_request:
    paths:
      - 'research/w3-p10b-e8-complex/**'
      - '.github/workflows/w3-p10b-e8-complex.yml'
  push:
    paths:
      - 'research/w3-p10b-e8-complex/**'
      - '.github/workflows/w3-p10b-e8-complex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Boost headers for the official checkers
        run: |
          if ! test -f /usr/include/boost/multiprecision/cpp_int.hpp; then
            sudo apt-get update
            sudo apt-get install -y libboost-dev
          fi
      - name: Install the pinned arithmetic dependencies
        run: python -m pip install --disable-pip-version-check -r research/w3-p10b-e8-complex/requirements.txt
      - name: Manifest, provenance, bit word (Design T, twin, official checkers, primes, banks), E8 complex checks with Lean binding, exact b, kappa
        run: bash research/w3-p10b-e8-complex/verify.sh "$RUNNER_TEMP/w3-p10b-e8-verify"
      - name: Require committed files to remain unchanged
        run: git diff --exit-code
