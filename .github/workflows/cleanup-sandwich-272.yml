name: Verify cancelled cleanup sandwiches on the PR272 bit word

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SymPy and Boost headers
        run: |
          python3 -m pip install -r research/cleanup-sandwich-272/requirements.txt
          sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Fetch the pinned PR272 package
        run: |
          git fetch --no-tags https://github.com/CrocSwap/integer-mult-bounds 4d23d0ee5682c99b792614bae4bc5330da19ff13
          mkdir -p "$RUNNER_TEMP/base272"
          git archive 4d23d0ee5682c99b792614bae4bc5330da19ff13 research/filtered-kernel-target120 | tar -x -C "$RUNNER_TEMP/base272"
      - name: Replay PR272, rewrite the 99 sandwiches, check endpoints and banks, reprice and run the finite invoice
        run: >
          python3 -B research/cleanup-sandwich-272/verify.py
          --base "$RUNNER_TEMP/base272/research/filtered-kernel-target120"
          --boost-include /usr/include --output "$RUNNER_TEMP/cleanup-sandwich-272"
      - name: Require committed files to remain unchanged
        run: git diff --exit-code
