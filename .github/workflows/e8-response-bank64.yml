name: Verify response-subspace banks at 64 replicas
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONINTMAXSTRDIGITS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: python -m pip install -r research/e8-response-subspaces/requirements.txt
      - run: python -B research/e8-response-bank64/verify.py "$RUNNER_TEMP/response-bank64"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: response-bank64-${{ matrix.python }}
          path: ${{ runner.temp }}/response-bank64
