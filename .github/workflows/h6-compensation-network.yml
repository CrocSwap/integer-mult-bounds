name: H6 compensation network

on:
  pull_request:
    paths:
      - 'research/h6-compensation-network/**'
      - 'research/h6-independent-audit/**'
      - 'research/h6-banked-breakeven/**'
      - 'research/niemeier-lattices/**'
      - 'research/leech-lattice/code/screen.py'
      - 'research/split-centres-global/vendor/clifford_exact.py'
      - 'research/community-efficient500-audit/packets/1424.json'
      - 'research/community-frontier1094-audit/SELECTED-SOURCE.json'
      - 'certificates/selected-result.json'
      - 'certificates/checkpoints/frontier890.json'
      - 'docs/research/community-batch1099-review.md'
      - 'docs/research/community-efficient500-review.md'
      - 'docs/research/community-frontier890-review.md'
      - 'notes/general-clifford-frames.tex'
      - 'scripts/verify_selected_result.py'
      - 'tests/test_selected_result.py'
      - '.github/workflows/h6-compensation-network.yml'
  push:
    branches: [main]
    paths:
      - 'research/h6-compensation-network/**'
      - 'research/h6-independent-audit/**'
      - 'research/h6-banked-breakeven/**'
      - 'research/niemeier-lattices/**'
      - 'research/leech-lattice/code/screen.py'
      - 'research/split-centres-global/vendor/clifford_exact.py'
      - 'research/community-efficient500-audit/packets/1424.json'
      - 'research/community-frontier1094-audit/SELECTED-SOURCE.json'
      - 'certificates/selected-result.json'
      - 'certificates/checkpoints/frontier890.json'
      - 'docs/research/community-batch1099-review.md'
      - 'docs/research/community-efficient500-review.md'
      - 'docs/research/community-frontier890-review.md'
      - 'notes/general-clifford-frames.tex'
      - 'scripts/verify_selected_result.py'
      - 'tests/test_selected_result.py'
      - '.github/workflows/h6-compensation-network.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h6-compensation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Exact H6 replay (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install the pinned exact-arithmetic array dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Replay the scoped package in a disposable source export
        run: python -I -O -B research/h6-compensation-network/ci.py
      - name: Check historical benchmark and immutable-source boundaries
        run: python -I -B research/h6-compensation-network/test_ci.py
      - name: Check selected-record integrity
        run: python -I -B scripts/verify_selected_result.py
      - name: Require unchanged checked-out sources and evidence
        run: git diff --exit-code
