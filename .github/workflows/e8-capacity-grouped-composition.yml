name: E8 grouped capacity and fifteen enlargements
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/e8-donor-prefix-composition/**'
      - 'research/e8-enlarged-sequential-composition/**'
      - 'research/e8-shared-donor-normalization-composition/**'
      - 'research/e8-response-normalization-composition/**'
      - 'research/e8-two-window-frame-extension/**'
      - 'research/e8-six-edit-frame-extension/**'
      - 'research/e8-signed-prefix-frame-extension/**'
      - 'research/e8-signed-prefix-fusion/**'
      - 'research/e8-hetero-fusion-composition/**'
      - 'research/e8-prefix-helper-composition/**'
      - 'research/e8-bit-signed-validation/**'
      - 'research/e8-far-helper-composition/**'
      - 'research/e8-nine-stage-composition/**'
      - 'research/e8-bit-helper-reuse/**'
      - 'research/e8-bit-seven-stage/**'
      - 'research/nine-stage-complex-e8/**'
      - 'research/e8-complex-far-retiming/**'
      - 'research/e8-capacity-grouped-composition/**'
      - 'research/e8-residual-padding-bound/**'
      - 'research/e8-propagated-padding-bound/**'
      - 'research/e8-higher-capacity-padding-bound/**'
      - '.github/workflows/e8-capacity-grouped-composition.yml'
  pull_request:
    paths:
      - 'research/e8-donor-prefix-composition/**'
      - 'research/e8-enlarged-sequential-composition/**'
      - 'research/e8-shared-donor-normalization-composition/**'
      - 'research/e8-response-normalization-composition/**'
      - 'research/e8-two-window-frame-extension/**'
      - 'research/e8-six-edit-frame-extension/**'
      - 'research/e8-signed-prefix-frame-extension/**'
      - 'research/e8-signed-prefix-fusion/**'
      - 'research/e8-hetero-fusion-composition/**'
      - 'research/e8-prefix-helper-composition/**'
      - 'research/e8-bit-signed-validation/**'
      - 'research/e8-far-helper-composition/**'
      - 'research/e8-nine-stage-composition/**'
      - 'research/e8-bit-helper-reuse/**'
      - 'research/e8-bit-seven-stage/**'
      - 'research/nine-stage-complex-e8/**'
      - 'research/e8-complex-far-retiming/**'
      - 'research/e8-capacity-grouped-composition/**'
      - 'research/e8-residual-padding-bound/**'
      - 'research/e8-propagated-padding-bound/**'
      - 'research/e8-higher-capacity-padding-bound/**'
      - '.github/workflows/e8-capacity-grouped-composition.yml'
permissions:
  contents: read
concurrency:
  group: e8-capacity-grouped-composition-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libboost-all-dev
      - name: Install pinned Python dependencies
        run: python -m pip install -r research/e8-bit-seven-stage/requirements.txt
      - name: Replay complete grouped capacity and enlargement composition
        run: PYTHONDONTWRITEBYTECODE=1 python -B research/e8-capacity-grouped-composition/verify.py "$RUNNER_TEMP/e8-capacity-grouped-composition"
      - name: Verify previous enlarged204 fixed-inventory padding appendix
        run: python -B research/e8-residual-padding-bound/verify.py "$RUNNER_TEMP/e8-capacity-grouped-composition/residual-padding-bound.json"
      - name: Verify previous propagated208 fixed-inventory padding appendix
        run: python -B research/e8-propagated-padding-bound/verify.py "$RUNNER_TEMP/e8-capacity-grouped-composition/propagated-padding-bound.json"
      - name: Verify higher-capacity215 fixed-inventory padding appendix
        run: python -B research/e8-higher-capacity-padding-bound/verify.py "$RUNNER_TEMP/e8-capacity-grouped-composition/higher-capacity-padding-bound.json"
      - name: Confirm tracked source files unchanged
        run: git diff --exit-code
      - name: Preserve replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e8-capacity-grouped-composition-${{ matrix.python-version }}
          path: ${{ runner.temp }}/e8-capacity-grouped-composition
