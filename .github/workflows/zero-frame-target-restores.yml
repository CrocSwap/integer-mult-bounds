name: Verify zero-frame target restores
on:
  push:
    paths:
      - 'research/zero-frame-target-restores/**'
      - '.github/workflows/zero-frame-target-restores.yml'
  pull_request:
    paths:
      - 'research/zero-frame-target-restores/**'
      - '.github/workflows/zero-frame-target-restores.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Obtain immutable PR272 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: CrocSwap/integer-mult-bounds
          ref: 4d23d0ee5682c99b792614bae4bc5330da19ff13
          path: build/pinned-pr272
          persist-credentials: false
      - name: Obtain immutable PR271 cleanup package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: evmckinney9/integer-mult-bounds
          ref: ebc1defe8c13f39f86e5901c3437c1be52886a2b
          path: build/pinned-pr271
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Use predecessor dependencies
        run: python -m pip install -r build/pinned-pr272/research/filtered-kernel-target120/requirements.txt
      - name: Fresh baseline, target restores and complete exact checks
        run: python -B research/zero-frame-target-restores/verify.py --base build/pinned-pr272/research/filtered-kernel-target120 --cleanup-base build/pinned-pr271/research/cleanup-sandwich-272 --output /tmp/zero-frame-restores-replay
      - name: Show nested verifier diagnostics on failure
        if: failure()
        run: |
          python - <<'PYDIAG'
          from pathlib import Path
          for path in sorted(Path('/tmp/zero-frame-restores-replay').rglob('*.log')):
              print('\n---', path, '---')
              print('\n'.join(path.read_text(errors='replace').splitlines()[-40:]))
          PYDIAG
      - name: Require unchanged tracked artifacts
        run: git diff --exit-code
