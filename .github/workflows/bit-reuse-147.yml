name: Verify recycled bit registers on the paired-cube bit word

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reproduce PR144, run the ledger, check exact nesting, replay and reprice
        run: python3 research/bit-reuse-147/verify.py
      - name: Require committed files to remain unchanged
        run: git diff --exit-code
