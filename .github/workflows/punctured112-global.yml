name: Verify punctured 112-port global witness

on:
  push:
    paths:
      - 'research/punctured112-global/**'
      - '.github/workflows/punctured112-global.yml'
  pull_request:
    paths:
      - 'research/punctured112-global/**'
      - '.github/workflows/punctured112-global.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reconstruct and audit the conditional witness
        run: python -B research/punctured112-global/verify.py --work "$RUNNER_TEMP/punctured112"
      - name: Require unchanged tracked artifacts
        run: git diff --exit-code
