name: Verify E8 helper reuse and assembly
on:
  pull_request:
    paths:
      - 'research/e8-bit-helper-reuse/**'
      - 'research/e8-bit-seven-stage/**'
      - '.github/workflows/e8-bit-helper-reuse.yml'
  push:
    paths:
      - 'research/e8-bit-helper-reuse/**'
      - 'research/e8-bit-seven-stage/**'
      - '.github/workflows/e8-bit-helper-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Pinned NumPy 2.5.3 requires Python 3.12 or newer.
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libboost-dev
          python -m pip install -r research/e8-bit-seven-stage/requirements.txt
      - name: Replay pinned source, helper reuse and exact assembly
        run: python -B research/e8-bit-helper-reuse/verify.py "$RUNNER_TEMP/e8-helper-reuse"
      - name: Confirm source tree unchanged
        run: git diff --exit-code
