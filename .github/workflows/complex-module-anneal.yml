name: complex-module-anneal

on:
  pull_request:
    paths:
      - 'research/complex-module-anneal/**'
      - '.github/workflows/complex-module-anneal.yml'
  push:
    paths:
      - 'research/complex-module-anneal/**'
      - '.github/workflows/complex-module-anneal.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the regeneration dependencies of the pinned pipeline
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Regenerate the words, check the frozen layers and pairs, run flow, lift and contract, emit the gcert/1 programs, write the star scatter, run gx.check1 and gxcore, price the five-stage words, compare with the committed certificates
        run: python3 -B research/complex-module-anneal/verify.py
      - name: Require an unchanged tree
        run: git diff --exit-code
