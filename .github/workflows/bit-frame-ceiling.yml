name: bit-frame-ceiling

on:
  pull_request:
    paths:
      - 'research/bit-frame-ceiling-200/**'
      - '.github/workflows/bit-frame-ceiling.yml'
  push:
    paths:
      - 'research/bit-frame-ceiling-200/**'
      - '.github/workflows/bit-frame-ceiling.yml'

jobs:
  ceiling:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bit frame-layout ceiling of #200's word, compared with expected.json
        run: python3 research/bit-frame-ceiling-200/ceiling.py --check
