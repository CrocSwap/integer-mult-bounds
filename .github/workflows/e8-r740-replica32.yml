name: e8-r740-replica32
on:
  pull_request:
    paths:
      - 'research/e8-r740-replica32/**'
      - '.github/workflows/e8-r740-replica32.yml'
  push:
    paths:
      - 'research/e8-r740-replica32/**'
      - '.github/workflows/e8-r740-replica32.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: python -m pip install -r research/e8-r740-replica32/parent436/requirements.txt
      - name: Full parent reconstruction and kernel verification
        run: bash research/e8-r740-replica32/verify.sh "$RUNNER_TEMP/e8-r740-replica32-full"
      - name: Require an unchanged tracked tree
        run: git diff --exit-code
