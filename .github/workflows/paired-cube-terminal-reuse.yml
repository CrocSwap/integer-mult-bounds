name: Verify paired-cube terminal accumulation and bit reuse

on:
  push:
    paths:
      - 'research/paired-cube-terminal-reuse/**'
      - 'research/paired-cube-bit/**'
      - 'research/paired-cube-bit-descent-168/**'
      - 'scripts/**'
      - 'references/paired-cube/**'
      - '.github/workflows/paired-cube-terminal-reuse.yml'
  pull_request:
    paths:
      - 'research/paired-cube-terminal-reuse/**'
      - 'research/paired-cube-bit/**'
      - 'research/paired-cube-bit-descent-168/**'
      - 'scripts/**'
      - 'references/paired-cube/**'
      - '.github/workflows/paired-cube-terminal-reuse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Rebuild both words and reproduce the complete certificate
        run: python3 -B research/paired-cube-terminal-reuse/verify.py
