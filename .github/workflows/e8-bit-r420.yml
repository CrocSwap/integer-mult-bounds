name: e8-bit-r420

# Historical witness replay; selected-family automation is in frontier588.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the Python requirements, a C++17 compiler and the Boost headers
        run: |
          python -m pip install --disable-pip-version-check -r research/e8-bit-r420/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libboost-dev
      - name: Verify (rebuild, independent replay and interface lemma, official checkers, nine- and eleven-stage prices, controls)
        run: CXX=g++ bash research/e8-bit-r420/verify.sh "$RUNNER_TEMP/e8-bit-r420"
      - name: Require committed files to remain unchanged
        run: git diff --exit-code
