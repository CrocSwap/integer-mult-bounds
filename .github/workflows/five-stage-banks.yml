name: Verify five-stage banks
on:
  pull_request:
    paths:
      - 'research/five-stage-banks/**'
      - '.github/workflows/five-stage-banks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: CrocSwap/integer-mult-bounds
          ref: af3fe331ca60c936229e060681ffccbc1c208678
          path: .dependencies/pr234
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install sympy==1.14.0
      - run: python -B research/five-stage-banks/verify.py --pr234-root .dependencies/pr234 --full
      - run: git diff --exit-code
