name: Verify gen5b weighted restart packing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r research/gen5b-weighted-repacked/requirements.txt
      - name: Fresh complete finite admission
        run: python -B research/gen5b-weighted-repacked/verify.py --output "$RUNNER_TEMP/weighted-repacked"
      - name: Require committed sources to remain unchanged
        run: git diff --exit-code

  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/gen5b-weighted-repacked/requirements.txt
      - name: Rebuild the inherited weighted virtual word
        run: python -B research/gen5b-weighted-repacked/gen5bit/producer/regenerate.py --work "$RUNNER_TEMP/weighted-repacked-producer"
      - name: Require committed sources to remain unchanged
        run: git diff --exit-code
