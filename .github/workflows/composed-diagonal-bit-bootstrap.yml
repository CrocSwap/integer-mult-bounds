name: Verify the composed diagonal-bit bootstrap record

on:
  push:
    paths:
      - 'research/composed-diagonal-bit-bootstrap/**'
      - '.github/workflows/composed-diagonal-bit-bootstrap.yml'
  pull_request:
    paths:
      - 'research/composed-diagonal-bit-bootstrap/**'
      - '.github/workflows/composed-diagonal-bit-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reproduce the composed record and check every pinned byte
        run: python3 -B research/composed-diagonal-bit-bootstrap/verify.py
      - name: Require an unchanged tree
        run: git diff --exit-code
