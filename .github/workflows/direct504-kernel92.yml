name: Direct504 kernel92 finite witness
on:
  push:
    paths:
      - 'research/direct504-kernel92/**'
      - '.github/workflows/direct504-kernel92.yml'
  pull_request:
    paths:
      - 'research/direct504-kernel92/**'
      - '.github/workflows/direct504-kernel92.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rebuild supplier, all local phases, owners and exact assembly
        run: python -B research/direct504-kernel92/verify.py "$RUNNER_TEMP/direct504-kernel92"
      - name: Require unchanged tracked sources
        run: git diff --exit-code
