name: Exact cached cube XOR replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/cube-xor-replay/**'
      - '.github/workflows/cube-xor-replay.yml'
  push:
    branches: [main]
    paths:
      - 'research/cube-xor-replay/**'
      - '.github/workflows/cube-xor-replay.yml'
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Every scheduled row and complete receipts
        run: python -I -O -B research/cube-xor-replay/verify.py
