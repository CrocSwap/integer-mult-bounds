name: Verify joint B-phase frame retiming
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B research/e8-joint-frame-retiming/verify.py "$RUNNER_TEMP/joint-frame-retiming" --replay-phases
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-frame-retiming-${{ matrix.python }}
          path: ${{ runner.temp }}/joint-frame-retiming
