name: p10b complex retiming
on:
  pull_request:
    paths:
      - 'research/p10b-complex-retiming/**'
      - '.github/workflows/p10b-complex-retiming.yml'
  push:
    paths:
      - 'research/p10b-complex-retiming/**'
      - '.github/workflows/p10b-complex-retiming.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: python -m pip install -r research/p10b-complex-retiming/vendor/predecessor/requirements.txt
      - name: Replay complete immutable construction
        run: python -B research/p10b-complex-retiming/verify.py --output "$RUNNER_TEMP/p10b-complex-retiming-proof" --cxx g++ --boost-include /usr/include
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p10b-complex-retiming-verification
          path: |
            ${{ runner.temp }}/p10b-complex-retiming-proof/VERIFICATION.json
            ${{ runner.temp }}/p10b-complex-retiming-proof/CERTIFICATE.json
            ${{ runner.temp }}/p10b-complex-retiming-proof/FAILURE.json
            ${{ runner.temp }}/p10b-complex-retiming-proof/logs/
