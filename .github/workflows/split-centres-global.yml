name: Split-centres global kappa
on:
  pull_request:
    paths:
      - 'research/split-centres-global/**'
      - '.github/workflows/split-centres-global.yml'
  push:
    paths:
      - 'research/split-centres-global/**'
      - '.github/workflows/split-centres-global.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B research/split-centres-global/verify.py "$RUNNER_TEMP/split-centres-check"
