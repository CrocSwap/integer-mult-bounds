name: Verify R740 idle-data hosting composition
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B research/e8-r740-idle-hosting/verify.py "$RUNNER_TEMP/r740-idle-hosting"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r740-idle-hosting-${{ matrix.python }}
          path: ${{ runner.temp }}/r740-idle-hosting
