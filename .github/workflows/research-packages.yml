name: Registered research packages
on:
  # Declared package inputs may live anywhere in the repository. Always plan;
  # the manifest-aware selector keeps unrelated changes out of replay jobs.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Git base for affected-package selection (use all-zero SHA to select all)
        default: HEAD^
        required: true
permissions:
  contents: read
concurrency:
  group: research-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Planning compares the event base and HEAD; replay has its own full checkout.
          # Manual dispatch retains arbitrary revision/ref support.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
          persist-credentials: false
      - name: Fetch exact automated review base
        if: github.event_name != 'workflow_dispatch'
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if [[ ! "$REVIEW_BASE" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo '::error::Automated review base must be a complete commit ID'
            exit 1
          fi
          # An all-zero push base keeps the existing all-tracked selection.
          if [[ "$REVIEW_BASE" =~ ^0+$ ]]; then
            exit 0
          fi
          if ! git cat-file -e "${REVIEW_BASE}^{commit}" 2>/dev/null; then
            git -c maintenance.auto=false -c gc.auto=0 fetch \
              --no-tags --no-recurse-submodules --depth=1 origin "$REVIEW_BASE"
          fi
          resolved_base="$(git rev-parse --verify --end-of-options "${REVIEW_BASE}^{commit}")"
          if [[ "$resolved_base" != "$REVIEW_BASE" ]]; then
            echo '::error::Fetched review base differs from the event commit'
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Onboarding helper tests
        run: python -B -m unittest discover -s tests -p 'test_research_*.py' -v
      - id: plan
        name: Select changed packages and declared input dependents
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
        run: python -B scripts/research_package.py --changed-since "$REVIEW_BASE" --matrix-batch-size 256 --github-output "$GITHUB_OUTPUT"
  replay:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      # Each called workflow owns at most 256 package jobs; batches run in
      # sequence so the inner four-worker concurrency budget is unchanged.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/research-package-batch.yml
    with:
      packages: ${{ toJSON(matrix.packages) }}

