name: w3-p10b-complex-p10
on:
  pull_request:
    paths: ['research/w3-p10b-complex-p10/**', '.github/workflows/w3-p10b-complex-p10.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y g++ libboost-dev
      - run: python -m pip install numpy mpmath
      - run: bash research/w3-p10b-complex-p10/verify.sh "$RUNNER_TEMP/w3-p10b-verify"
