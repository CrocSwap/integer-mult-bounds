name: W3 with kernel, target-prefix, plateau and reorder stages
on:
  push:
    branches: [w3-stages]
    paths: ['research/w3-stages-restore/**', '.github/workflows/w3-stages-restore.yml']
  pull_request:
    paths: ['research/w3-stages-restore/**', '.github/workflows/w3-stages-restore.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y g++ libboost-dev
      - run: python -m pip install -r research/w3-stages-restore/requirements.txt
      - run: python -B research/w3-stages-restore/verify.py --output "$RUNNER_TEMP/w3-replay" --cxx g++
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-stages-receipts
          path: |
            ${{ runner.temp }}/w3-replay/*.json
            ${{ runner.temp }}/w3-replay/logs
            ${{ runner.temp }}/w3-replay/baseline/verification.json
