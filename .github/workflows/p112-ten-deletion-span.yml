name: P112 ten-deletion span

on:
  workflow_dispatch:

concurrency:
  group: research-archive-replay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  exact-replay:
    if: github.repository == 'CrocSwap/integer-mult-bounds'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check native environment and replay
        run: |
          c++ --version
          python -W error -B scripts/research_package.py --package research/p112-ten-deletion-span
