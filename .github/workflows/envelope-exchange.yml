name: Verify envelope exchange witness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Restore exact inherited source closure
        run: |
          mkdir -p research/round6-pr71/baseline
          git archive 1bef94fd40a746452548c84a4a8f8834670a3113 | tar -x -C research/round6-pr71/baseline
      - name: Recompile, replay, rebuild profiles and verify exact inequalities
        run: python3 research/round7-scheduling/verify.py --regenerate
      - name: Require unchanged frozen artifacts
        run: git diff --exit-code
