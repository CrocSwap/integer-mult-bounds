name: Verify warm R715 kernel and target factors
on:
  pull_request:
    paths: ['research/r715-warm-kernel/**', 'research/r715-warm-target-factors/**', 'research/r715-factors-complex79/**', 'research/r715-factor-replica64/**', 'research/r715-replica64-complex79/**', 'research/r715-factor-replica84/**', 'research/r715-replica84-complex79/**', 'research/r715-response-replica28/**', 'research/r715-basis-exchange84/**', '.github/workflows/r715-warm-followups.yml']
  push:
    paths: ['research/r715-warm-kernel/**', 'research/r715-warm-target-factors/**', 'research/r715-factors-complex79/**', 'research/r715-factor-replica64/**', 'research/r715-replica64-complex79/**', 'research/r715-factor-replica84/**', 'research/r715-replica84-complex79/**', 'research/r715-response-replica28/**', 'research/r715-basis-exchange84/**', '.github/workflows/r715-warm-followups.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
        package: ['r715-warm-kernel', 'r715-warm-target-factors', 'r715-factors-complex79', 'r715-replica64-complex79', 'r715-replica84-complex79', 'r715-response-replica28', 'r715-basis-exchange84']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y g++ libboost-dev
      - run: python -m pip install -r research/e8-r740-replica32/parent436/requirements.txt
      - run: python -B research/${{ matrix.package }}/verify.py "$RUNNER_TEMP/warm-followup"
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONINTMAXSTRDIGITS: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.package }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/warm-followup/*.json
            ${{ runner.temp }}/warm-followup/*.log
