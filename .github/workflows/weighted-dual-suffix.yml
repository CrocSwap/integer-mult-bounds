name: Verify weighted dual-suffix carriers
on: [push, pull_request]
jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python research/weighted-dual-suffix/verify.py
      - run: python research/weighted-dual-suffix/test_controls.py
