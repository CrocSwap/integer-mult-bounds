name: e8-r715-kernel-cap
on:
  pull_request:
    paths:
      - 'research/e8-r715-kernel-cap/**'
      - 'research/e8-r715-eleven-stage-whole/**'
      - 'research/e8-r715-paid-complex/**'
      - 'research/e8-complex-adapted-kernel/**'
      - 'research/e8-r740-replica32/**'
      - 'research/idle-axis-hosting/**'
      - '.github/workflows/e8-r715-kernel-cap.yml'
  push:
    paths:
      - 'research/e8-r715-kernel-cap/**'
      - '.github/workflows/e8-r715-kernel-cap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  light:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r research/e8-r740-replica32/parent436/requirements.txt scipy ortools
      - name: LIGHT - ceiling, selection, kernel, mixing, width rule, hosting re-solve, screen composition
        run: python -B research/e8-r715-kernel-cap/verify.py "$RUNNER_TEMP/e8-r715-kernel-cap-light" --light
      - name: Require an unchanged tracked tree
        run: git diff --exit-code
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: python -m pip install -r research/e8-r740-replica32/parent436/requirements.txt scipy ortools
      - name: FULL - search from scratch, bit supplier, PR 458 complex supplier, exact composition
        run: python -B research/e8-r715-kernel-cap/verify.py "$RUNNER_TEMP/e8-r715-kernel-cap-full"
      - name: Require an unchanged tracked tree
        run: git diff --exit-code
