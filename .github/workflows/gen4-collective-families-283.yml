name: gen4-collective-families-283

on:
  pull_request:
    paths:
      - 'research/gen4-collective-families-283/**'
      - '.github/workflows/gen4-collective-families-283.yml'
  push:
    paths:
      - 'research/gen4-collective-families-283/**'
      - '.github/workflows/gen4-collective-families-283.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the native toolchain of PR 283's checkers
        run: sudo apt-get update && sudo apt-get install -y g++ libboost-dev
      - name: Install SymPy for the vendored PR 276 stages
        run: python -m pip install -r research/gen4-collective-families-283/requirements.txt
      - name: Replay PR 276, every composed stage, the audits, the price and the finite invoice on the 832-pivot word
        run: python3 -B research/gen4-collective-families-283/verify.py --output /tmp/gen4-collective-replay
      - name: Require an unchanged tree
        run: git diff --exit-code
