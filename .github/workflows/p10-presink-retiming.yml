name: p10 presink retiming
on:
  pull_request:
    paths:
      - 'research/p10-presink-retiming/**'
      - '.github/workflows/p10-presink-retiming.yml'
  push:
    paths:
      - 'research/p10-presink-retiming/**'
      - '.github/workflows/p10-presink-retiming.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/p10-presink-retiming/requirements.txt
      - name: Replay complete immutable construction
        run: python -B research/p10-presink-retiming/verify.py --output "$RUNNER_TEMP/p10-presink-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p10-presink-verification
          path: |
            ${{ runner.temp }}/p10-presink-proof/verification.json
            ${{ runner.temp }}/p10-presink-proof/certificate.json
            ${{ runner.temp }}/p10-presink-proof/failure.json
