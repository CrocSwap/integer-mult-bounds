name: Graded box convolution
on:
  workflow_dispatch:

# Historical sweeps are opt-in; dispatch one at a time.
concurrency:
  group: research-archive-replay
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B research/graded-box-convolution/verify.py "$RUNNER_TEMP/graded-box"
