name = "TriangularSupplier"
version = "1.0.0"
defaultTargets = ["SupplierProofs"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "PreviousMultiplication"
srcDir = "retained"
roots = ["PaddedGrid", "TraceProduct", "TensorStability", "GridBridge", "ChirpTransform", "AccretiveFactors", "CirculantOperators", "PublicGrid", "Integrated", "Recovery", "Coordinates"]

[[lean_lib]]
name = "SupplierProofs"
roots = ["MeanPack", "CarrierStages", "SameOrder", "ChartAction", "LimbScale", "PackedGrid", "TensorMasks", "CompletePacks", "GatePacks", "ActiveForest", "UniformSpace"]
