name = "LeanRelease"
defaultTargets = ["Nov15"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
# pinned to the exact commit used for every check in this package (same as lake-manifest.json)
rev = "55b7917b472489c7c56a0fa6393af05cfd536599"

[[lean_lib]]
name = "Nov15"
globs = ["Nov15.+"]

# Optional, NOT built by default: the native_decide route for V2-FLOOR (depends on Lean.ofReduceBool).
# Sources live in native/Nov15/ and import the kernel-only modules above; no kernel-only module imports them.
[[lean_lib]]
name = "NativeRoute"
srcDir = "native"
globs = ["Nov15.+"]
