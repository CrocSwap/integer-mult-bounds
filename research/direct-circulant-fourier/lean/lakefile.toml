name = "RootCirculant"
version = "1.0.0"
defaultTargets = ["RootCirculantProofs"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "MixedRankMultiplication"
git = "https://github.com/aliromman/integer-mult-bounds.git"
rev = "343f7b1817e26ad3f89d2ddad313b12741d53602"
subDir = "research/mixed-rank-uniform-composition/lean"

[[lean_lib]]
name = "RootCirculantProofs"
roots = ["CirculantOperators", "AccretiveFactors", "ChirpTransform", "PaddedDisplacement", "TensorStability", "HeterogeneousRows", "GridBridge", "TraceProduct", "PaddedGrid"]
