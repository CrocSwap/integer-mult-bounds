name: r420-target-basis

on:
  push:
    paths:
      - 'research/r420-target-basis/**'
      - '.github/workflows/r420-target-basis.yml'
  pull_request:
    paths:
      - 'research/r420-target-basis/**'
      - '.github/workflows/r420-target-basis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B research/r420-target-basis/verify.py
      - run: python -B -m unittest discover -s research/r420-target-basis -p 'test_*.py'
      - name: Install Boost for unchanged C++ checkers
        if: matrix.python-version == '3.13'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-dev
      - name: Fresh C++ legality and multistage columns
        if: matrix.python-version == '3.13'
        run: CXX=g++ python -B research/r420-target-basis/native.py
      - run: git diff --exit-code
