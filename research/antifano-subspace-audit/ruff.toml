target-version = "py312"
line-length = 100

[lint]
select = ["ALL"]
ignore = [
  "D203", "D213", # Mutually exclusive with the selected D211/D212 docstring rules.
  "INP001", # Standalone scripts discovered by unittest, not an importable package.
  "PLR2004", # Literal dimensions and ranks name the fixed mathematical instance.
  "PT009", "PT027", # Keep standard-library unittest and its -O-safe assertions.
  "T201", # The CLI's single PASS line is its documented observable output.
]
