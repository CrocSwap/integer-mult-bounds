name: Owner footprint bitsets
on:
  pull_request:
    paths:
      - 'research/owner-footprint-bitsets/**'
      - '.github/workflows/owner-footprint-bitsets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -I -B research/owner-footprint-bitsets/test_masks.py
      - run: python -I -B -O research/owner-footprint-bitsets/test_masks.py
      - run: python -I -B research/owner-footprint-bitsets/verify.py
      - run: python -B scripts/verify_selected_result.py
