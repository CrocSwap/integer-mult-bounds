# Manual research replay; archival intake is not scientific validation.
# See docs/research/research-archive-intake.md before dispatching.
name: Mixed joint entrances T37
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: research-archive-replay
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      CXX: g++
      BOOST_INCLUDE: /usr/include
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install inherited replay dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libboost-dev
          python -m pip install -r research/e8-bit-p111-tuned/requirements.txt
      - name: Fresh mixed providers, literal owners, strict invoice and cold ancestry
        run: python -B research/mixed-demotions-t37/verify.py --work "$RUNNER_TEMP/mixed-t37"
      - name: Require committed sources unchanged
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mixed-t37-evidence
          path: |
            ${{ runner.temp }}/mixed-t37/*.json
            ${{ runner.temp }}/mixed-t37/*.log
            ${{ runner.temp }}/mixed-t37/t37/**/*.json
            ${{ runner.temp }}/mixed-t37/t37/**/*.log
            ${{ runner.temp }}/mixed-t37/demote*/**/*.json
            ${{ runner.temp }}/mixed-t37/demote*/*.log
          retention-days: 14
