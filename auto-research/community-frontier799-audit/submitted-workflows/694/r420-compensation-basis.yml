name: R420 compensation basis exact checks

on:
  pull_request:
    paths:
      - 'research/r420-compensation-basis/**'
      - '.github/workflows/r420-compensation-basis.yml'
  push:
    paths:
      - 'research/r420-compensation-basis/**'
      - '.github/workflows/r420-compensation-basis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ensure Boost headers are available
        run: |
          if ! test -f /usr/include/boost/multiprecision/cpp_int.hpp; then
            sudo apt-get update
            sudo apt-get install -y libboost-dev
          fi
      - name: Exact Python and unchanged C++ checks
        run: |
          python3 -I -O -B research/r420-compensation-basis/verify.py --native
          git diff --exit-code
